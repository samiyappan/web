<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliding Portfolio</title>
    <link rel="stylesheet" href="stylesheet2.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="sidebar">
        <ul>
            <li class="menu-item" data-target="about">About</li>
            <li class="menu-item" data-target="resume">Resume</li>
            <li class="menu-item" data-target="works">Works</li>
            <li class="menu-item" data-target="blog">Blog</li>
            <li class="menu-item" data-target="contact">Contact</li>
        </ul>
    </div>
    <div class="content">
        <section id="about" class="section active">
            <div class="profile">
                <img src="profile.jpg" alt="Profile Picture">
                <h2>About Me</h2>
            </div>
        </section>
        <section id="resume" class="section">Resume</section>
        <section id="works" class="section">Works</section>
        <section id="blog" class="section">Blog</section>
        <section id="contact" class="section">Contact</section>
    </div>

    <script>
        $(document).ready(function () {
            $('.menu-item').click(function () {
                var target = $(this).data('target');
                $('.section').removeClass('active');
                $('#' + target).addClass('active');
            });
        });
    </script>
</body>
</html>
